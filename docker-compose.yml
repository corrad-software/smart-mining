# Smart Mining — web (Vue), api (Laravel + Filament), db (PostgreSQL 17 + PostGIS).
#
# Local:  docker compose up --build
#         web http://localhost:41880   api http://localhost:41808/admin
#
# Coolify: these host ports avoid the usual 3000 / 8000–9000 range.
#          Open TCP 41880 (web) and TCP 41808 (api) in the AWS security group.
#          Do not open the database. Set APP_URL, VITE_API_URL, and
#          CORS_ALLOWED_ORIGINS to the public host before the first start.

services:
  db:
    build:
      context: .
      dockerfile: docker/db/Dockerfile
    environment:
      POSTGRES_DB: ${DB_DATABASE:-smart_mining}
      POSTGRES_USER: ${DB_USERNAME:-smart_mining}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-smartmining}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 20s
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: docker/api/Dockerfile
    environment:
      APP_NAME: "${APP_NAME:-Smart Mining}"
      APP_ENV: production
      APP_KEY: ${APP_KEY:-}
      APP_DEBUG: "${APP_DEBUG:-false}"
      APP_URL: ${APP_URL:-http://localhost:41808}
      LOG_CHANNEL: stderr
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: "5432"
      DB_DATABASE: ${DB_DATABASE:-smart_mining}
      DB_USERNAME: ${DB_USERNAME:-smart_mining}
      DB_PASSWORD: ${DB_PASSWORD:-smartmining}
      SESSION_DRIVER: database
      CACHE_STORE: database
      QUEUE_CONNECTION: database
      FILESYSTEM_DISK: local
      CORS_ALLOWED_ORIGINS: "${CORS_ALLOWED_ORIGINS:-http://localhost:41880,http://127.0.0.1:41880}"
    volumes:
      - api-storage:/app/storage
    ports:
      - "${API_PORT:-41808}:80"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1/up"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: docker/web/Dockerfile
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:41808/api}
    ports:
      - "${WEB_PORT:-41880}:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    restart: unless-stopped

volumes:
  pgdata:
  api-storage:
